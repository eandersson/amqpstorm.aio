name: Testing

on:
  push:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 13 * * 1'

jobs:
  test:
    name: Unit and functional
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14', '3.14t']
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Lint with ruff
        run: ruff check amqpstorm_aio codegen examples
      - name: Type-check with mypy
        run: mypy
      - name: Verify spec.py is in sync with the vendored XML
        run: |
          python codegen/generate.py
          git diff --exit-code amqpstorm_aio/spec.py
      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover amqpstorm_aio/tests -v
          coverage report -m

  end-to-end:
    name: End-to-end against ${{ matrix.broker.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        broker:
          - name: RabbitMQ
            dockerfile: docker/Dockerfile.rabbitmq
            ctl: rabbitmqctl --longnames
            ready_log: Server startup complete
          - name: LavinMQ
            dockerfile: docker/Dockerfile.lavinmq
            ctl: lavinmqctl
            ready_log: Finished startup
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
      - name: Install
        run: pip install -e .[dev]
      - name: Start ${{ matrix.broker.name }}
        env:
          CTL: ${{ matrix.broker.ctl }}
          DOCKERFILE: ${{ matrix.broker.dockerfile }}
          READY_LOG: ${{ matrix.broker.ready_log }}
        run: |
          ctl() { docker exec amqpstormaio-broker $CTL "$@"; }
          docker build -t amqpstormaio-broker -f "$DOCKERFILE" ./docker/
          docker run -d --hostname rmq.eandersson.net --name amqpstormaio-broker \
            -p 5671:5671 -p 5672:5672 -p 15671:15671 -p 15672:15672 amqpstormaio-broker
          for _ in $(seq 60); do
            docker logs amqpstormaio-broker 2>&1 | grep -q "$READY_LOG" && break
            sleep 1
          done
          ctl add_user 'amqpstorm' '2a55f70a841f18b'
          ctl set_permissions -p / 'amqpstorm' '.*' '.*' '.*'
          ctl set_user_tags amqpstorm administrator
          ctl list_users
          # The TLS tier needs the certificates the image generated for this hostname.
          mkdir -p amqpstorm_aio/tests/scenario/resources
          docker cp amqpstormaio-broker:/etc/rabbitmq/ssl/ ./amqpstorm_aio/tests/scenario/resources/
      - name: Run end-to-end tests
        env:
          AMQP_BROKER: ${{ matrix.broker.name }}
        run: python -m unittest discover amqpstorm_aio/tests/scenario -t . -v
      - name: Broker logs
        if: failure()
        run: docker logs amqpstormaio-broker 2>&1 | tail -100
